name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # macOS required: install.sh refuses other OSes, the tests exercise
    # plutil/PlistBuddy/swiftc/codesign, and brew style lints the Formula.
    # ioreg and launchctl are stubbed, and the notification call is
    # redirected to a logging stub, so no Bluetooth hardware or GUI
    # session is needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: Run tests
        run: ./test.sh

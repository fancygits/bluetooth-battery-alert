name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # macOS required: install.sh refuses other OSes and the tests exercise
    # plutil/PlistBuddy. Everything else (ioreg, osascript, launchctl) is
    # stubbed by test.sh, so no Bluetooth hardware or GUI session is needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: Run tests
        run: ./test.sh
